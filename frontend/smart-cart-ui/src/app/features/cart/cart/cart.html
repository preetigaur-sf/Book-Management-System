<div class="container py-5">
  <h2 class="mb-4 fw-bold">My Cart</h2>

  <div class="row">
    <div class="col-lg-4 col-md-6 mb-4" *ngFor="let item of cartItems">
      <div class="card h-100 shadow">
        <img
          [src]="item.product.image_url"
          class="card-img-top p-3"
          height="250"
          [alt]="item.product.name"
        />

        <div class="card-body">
          <h5>{{ item.product.name }}</h5>

          <p class="text-muted">
            {{ item.product.description }}
          </p>

          <h4 class="text-success">₹{{ item.product.price }}</h4>
          <div class="d-flex align-items-center gap-2 mb-3">
            <strong>Quantity:</strong>

            <button class="btn btn-sm btn-outline-secondary" (click)="decreaseQuantity(item)">
              -
            </button>

            <span>{{ item.quantity }}</span>

            <button class="btn btn-sm btn-outline-primary" (click)="increaseQuantity(item)">
              +
            </button>
          </div>
        </div>

        <div class="card-footer bg-white border-0">
          <button class="btn btn-danger w-100" (click)="removeCart(item)">Remove</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow mt-4 p-4" *ngIf="cartItems.length > 0">
    <h4>Order Summary</h4>
    <hr />
    <div class="d-flex justify-content-between mb-2">
      <strong>Total Items</strong>
      <span>{{ cartItems.length }}</span>
    </div>
    <div class="d-flex justify-content-between mb-3">
      <strong>Total Amount</strong>
      <span>{{ totalAmount }}</span>
    </div>
    <div class="mb-3 mt-3">
      <label class="form-label fw-bold"> Shipping Address </label>

      <textarea
        class="form-control"
        rows="3"
        [(ngModel)]="shippingAddress"
        placeholder="Enter Shipping Address"
      >
      </textarea>
    </div>
    <button class="btn btn-success w-100" (click)="placeOrder()">Place Order</button>
  </div>
  <div class="alert alert-info" *ngIf="cartItems.length === 0">Your cart is empty.</div>
</div>
