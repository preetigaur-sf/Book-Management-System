<div class="dashboard">

  <h2>Admin Dashboard 👋</h2>

  <p class="welcome">
    Welcome to SmartCart Admin Panel
  </p>

  <div class="cards">

    <div class="card">
      <h3>Products</h3>
      <h1>{{ totalProducts }}</h1>
    </div>

    <div class="card">
      <h3>Categories</h3>
      <h1>{{ totalCategories }}</h1>
    </div>

    <div class="card">
      <h3>Orders</h3>
      <h1>{{ totalOrders }}</h1>
    </div>

    <div class="card">
      <h3>Users</h3>
      <h1>{{ totalUsers }}</h1>
    </div>

  </div>

</div>
