<div class="container mt-4">

  <div class="card">

    <div class="card-header">

      <h3>Edit Order Status</h3>

    </div>

    <div class="card-body">

      <div class="mb-3">

        <label class="form-label">

          Order Status

        </label>

        <select
          class="form-select"
          [(ngModel)]="selectedStatus">

          <option value="PLACED">
            PLACED
          </option>

          <option value="SHIPPED">
            SHIPPED
          </option>

          <option value="DELIVERED">
            DELIVERED
          </option>

          <option value="CANCELLED">
            CANCELLED
          </option>

        </select>

      </div>

      <button
        class="btn btn-warning"
        (click)="updateStatus()">

        Update Status

      </button>

    </div>

  </div>

</div>
