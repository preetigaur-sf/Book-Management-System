<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header">
      <h3>Add Product</h3>
    </div>

    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
        <div class="mb-3">
          <label class="form-label"> Product Name </label>

          <input type="text" class="form-control" formControlName="name" />
        </div>

        <div class="mb-3">
          <label class="form-label"> Description </label>

          <textarea class="form-control" rows="3" formControlName="description"> </textarea>
        </div>

        <div class="mb-3">
          <label class="form-label"> Price </label>

          <input type="number" class="form-control" formControlName="price" />
        </div>

        <div class="mb-3">
          <label class="form-label"> Stock Quantity </label>

          <input type="number" class="form-control" formControlName="stock_quantity" />
        </div>

        <div class="mb-3">
          <label class="form-label"> SKU </label>

          <input type="text" class="form-control" formControlName="sku" />
        </div>

        <div class="mb-3">
          <label class="form-label"> Image URL </label>

          <input type="text" class="form-control" formControlName="image_url" />
        </div>
        <div class="mb-3">
          <label class="form-label"> Brand ID </label>

          <input type="number" class="form-control" formControlName="brand_id" />
        </div>

        <div class="mb-3">
          <label class="form-label"> Category ID </label>

          <input type="number" class="form-control" formControlName="category_id" />
        </div>

        <button type="submit" class="btn btn-success">Save Product</button>
      </form>
    </div>
  </div>
</div>
