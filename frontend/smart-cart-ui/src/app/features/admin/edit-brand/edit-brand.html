<div class="container mt-4">

  <div class="card">

    <div class="card-header">

      <h3>Edit Brand</h3>

    </div>

    <div class="card-body">

      <form
        [formGroup]="brandForm"
        (ngSubmit)="updateBrand()">

        <div class="mb-3">

          <label class="form-label">

            Brand Name

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="name">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Description

          </label>

          <textarea
            rows="4"
            class="form-control"
            formControlName="description">
          </textarea>

        </div>

        <button
          type="submit"
          class="btn btn-warning">

          Update Brand

        </button>

      </form>

    </div>

  </div>

</div>
