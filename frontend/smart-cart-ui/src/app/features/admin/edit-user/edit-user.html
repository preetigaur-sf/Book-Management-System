<div class="container mt-4">

  <div class="card">

    <div class="card-header">

      <h3>Edit User</h3>

    </div>

    <div class="card-body">

      <form
        [formGroup]="userForm"
        (ngSubmit)="updateUser()">

        <div class="mb-3">

          <label class="form-label">

            First Name

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="first_name">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Last Name

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="last_name">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Email

          </label>

          <input
            type="email"
            class="form-control"
            formControlName="email">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Role

          </label>

          <select
            class="form-select"
            formControlName="role_id">

            <option [value]="1">

              Admin

            </option>

            <option [value]="2">

              User

            </option>

          </select>

        </div>

        <div class="d-flex gap-2">

          <button
            type="submit"
            class="btn btn-success">

            Update User

          </button>

          <button
            type="button"
            class="btn btn-secondary"
            (click)="cancel()">

            Cancel

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
