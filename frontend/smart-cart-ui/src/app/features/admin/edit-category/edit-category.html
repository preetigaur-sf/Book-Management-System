<div class="container mt-4">

  <div class="card">

    <div class="card-header">

      <h3>Edit Category</h3>

    </div>

    <div class="card-body">

      <form
        [formGroup]="categoryForm"
        (ngSubmit)="updateCategory()">

        <div class="mb-3">

          <label class="form-label">
            Category Name
          </label>

          <input
            type="text"
            class="form-control"
            formControlName="name">

        </div>

        <button
          type="submit"
          class="btn btn-warning">

          Update Category

        </button>

      </form>

    </div>

  </div>

</div>
