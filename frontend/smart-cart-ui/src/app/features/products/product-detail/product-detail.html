<div class="container py-5" *ngIf="product">
  <div class="card shadow-lg border-0">
    <div class="row g-0">
      <div class="col-md-5 text-center p-4">
        <img [src]="product.image_url" [alt]="product.name" class="img-fluid product-image" />
      </div>

      <div class="col-md-7">
        <div class="card-body p-4">
          <h2 class="fw-bold mb-3">
            {{ product.name }}
          </h2>
          <div class="mb-3">
            <span class="badge bg-success px-2 py-2"> ★ 4.8 </span>

            <span class="ms-2 text-muted"> 1,245 Ratings | 250 Reviews </span>
          </div>

          <h3 class="text-success fw-bold mb-3">₹{{ product.price | number }}</h3>

          <p class="text-muted mb-4">
            {{ product.description }}
          </p>

          <p>
            <strong>Product ID :</strong>
            {{ product.id }}
          </p>

          <p>
            <strong>SKU :</strong>
            {{ product.sku }}
          </p>

          <p>
            <strong>Category :</strong>
            {{ product.category_id }}
          </p>

          <div class="mb-4">
            <span class="badge bg-success" *ngIf="product.stock_quantity > 0">
              In Stock ({{ product.stock_quantity }})
            </span>

            <span class="badge bg-danger" *ngIf="product.stock_quantity == 0"> Out of Stock </span>
          </div>
          <div class="d-flex align-items-center mb-3">
            <strong class="me-3">Quantity</strong>

            <button class="btn btn-outline-secondary" (click)="decreaseQuantity()">-</button>

            <span class="mx-3 fw-bold">
              {{ quantity }}
            </span>

            <button class="btn btn-outline-secondary" (click)="increaseQuantity()">+</button>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button class="btn btn-primary px-4" (click)="addToCart()">Add to Cart</button>
            <button *ngIf="!isWishlisted" class="btn btn-outline-danger" (click)="addToWishlist()">
              <i class="fa-regular fa-heart"></i>

              Wishlist
            </button>

            <button *ngIf="isWishlisted" class="btn btn-danger" (click)="removeWishlist()">
              <i class="fa-solid fa-heart"></i>

              Remove Wishlist
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
