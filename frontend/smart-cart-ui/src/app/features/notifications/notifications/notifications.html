<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>🔔 Notifications</h3>
    </div>

    <div class="card-body">
      <div
        *ngFor="let notification of notifications"
        class="card mb-3"
        [class.border-primary]="!notification.is_read"
        (click)="markAsRead(notification.id!)"
        style="cursor: pointer"
      >
        <div class="card-body">
          <h5 class="card-title">
            {{ notification.title }}
          </h5>

          <p class="card-text">
            {{ notification.message }}
          </p>

          <small class="text-muted">
            {{ notification.created_at | date: 'medium' }}
          </small>

          <span *ngIf="!notification.is_read" class="badge bg-primary float-end"> New </span>
        </div>
      </div>

      <div *ngIf="notifications.length === 0" class="text-center">No Notifications Found</div>
    </div>
  </div>
</div>
